name: Apex development validation
on:
  push:
    branches: [main, 'apex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Fetch pinned private Python 3.7 build compiler
        run: python tools/fetch_build_python.py
      - name: Offline ownership, isolation and CLI fixtures
        run: python -m unittest discover -s tests -v
      - name: Canonical source identity
        run: python tools/source_manifest.py --check
      - name: Python 3.7 source and game-compatible bytecode package
        run: python tools/build_script.py --output dist/dev/ApexOccultHybrid.ts4script
      - name: Configure native x64 overlay
        run: cmake -S NativeOverlay -B NativeOverlay/build -A x64
      - name: Compile native overlay
        run: cmake --build NativeOverlay/build --config Release
      - name: Native transport and UI data fixtures
        run: ctest --test-dir NativeOverlay/build -C Release --output-on-failure
