[package]
name = "apex-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Explicit one-shot metadata enrichment and offline CAS catalogue queries"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:rayon", "dep:reqwest", "dep:tempfile", "dep:regex"]

[[bin]]
name = "apex-catalog"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"], optional = true }
rayon = { version = "1.12", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"], optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tempfile = { version = "3.23", optional = true }
regex = { version = "1.13.1", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
