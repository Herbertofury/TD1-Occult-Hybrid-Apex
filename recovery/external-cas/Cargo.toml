[package]
name = "apex-external-cas-draft-research"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
# Reuse the pinned hash implementation already evaluated by draft-store.
# The library itself remains dependency-free; diagnostic examples use this.
sha2 = "=0.10.9"

# Isolated retained-pool experiment, reused from the existing registry cache.
rayon = "=1.12.0"

# Isolated lossless swatch staging; the core library remains dependency-free.
png = "=0.18.1"

# Optional inspect-only catalog transport; maintained strict base64url decoding.
# Example/dev only. The production/core library remains dependency-free.
base64 = "=0.23.1"

# Existing lockfile version; Linux nonblocking asset-file open flags.
libc = "=0.2.191"
